name: langscan

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langscan -d langscan"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: ghcr.io/kamiloso/langscanapp:production
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db_network
      - access_network

networks:
  db_network:
    driver: bridge
  access_network:
    driver: bridge

volumes:
  pgdata: