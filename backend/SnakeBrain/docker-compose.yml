services:
  app:
    build: .
    ports:
      - "127.0.0.1:8081:8000"
    environment:
      - GEMMA_URL=http://gemma:11434/v1/chat/completions
      - GEMMA_MODEL=gemma4:e2b
    depends_on:
      gemma:
        condition: service_healthy
      gemma-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  gemma:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  gemma-pull:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=http://gemma:11434
    depends_on:
      gemma:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "gemma4:e2b"]
    restart: "no"

volumes:
  ollama-data: